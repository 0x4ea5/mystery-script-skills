<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101b20;color:#e3e9e7;font:16px/1.65 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1100px;margin:auto;padding:36px 24px}h1{font-size:30px;margin:0}small,.muted{color:#a8bdb5}a{color:#c1e2d1}header{margin-bottom:28px}.layout{display:grid;grid-template-columns:320px 1fr;gap:24px}.card{background:#1a2a30;border:1px solid #34484a;border-radius:14px;padding:20px}button{font:inherit;color:inherit;cursor:pointer;background:#263a3d;border:1px solid #47615c;border-radius:8px;padding:10px 14px}#list button{display:block;width:100%;text-align:left;margin:8px 0}#list button.active{background:#39594e;border-color:#9bbfac}audio{width:100%;margin:18px 0}#text{max-height:62vh;overflow:auto;padding-right:10px}.turn{padding:10px 12px;border-radius:8px;cursor:pointer;border-left:3px solid transparent}.turn b{color:#a7d2c3;display:block;font-size:13px}.turn.active{background:#2f4841;border-left-color:#bbdbca}.turn:hover{background:#243b3c}#segments{display:flex;gap:8px;flex-wrap:wrap;font-size:13px;margin:10px 0 20px}#segments button{font-size:13px;padding:6px 10px}.links{margin-top:18px;display:flex;gap:20px;flex-wrap:wrap}@media(max-width:720px){.layout{grid-template-columns:1fr}main{padding:22px 14px}#list{max-height:240px;overflow:auto}#text{max-height:50vh}}
</style>
<main><header><small>本地音频 · 固定声线 · 按话题穿插</small><h1>__TITLE__</h1><p class="muted">分章穿插对话，保留猜错、追问与改口。含完整剧透。</p><div class="links"><a id="master" download>整段MP3</a><a href="全流程对白稿.txt">全文与阅读节点</a><a href="章节时间.txt">整段章节时间</a><a href="收听说明.txt">制作与来源说明</a></div></header>
<div class="layout"><nav class="card" id="list"></nav><section class="card"><small id="counter"></small><h2 id="title"></h2><audio id="audio" controls preload="metadata"></audio><div><button id="prev">上一章</button> <button id="next">下一章</button> <label style="margin-left:12px">语速 <select id="speed"><option value="0.85">0.85×</option><option selected value="1">1×</option><option value="1.15">1.15×</option><option value="1.3">1.3×</option></select></label></div><div id="segments"></div><div id="text"></div></section></div><p class="muted">AI合成配音。实际模拟的口语改编，未逐字朗读全套材料。点击对白可跳到该句。</p></main>
<script>
const data=__DATA__;
const audio=document.getElementById('audio'), list=document.getElementById('list'), text=document.getElementById('text');
let current=0,last=-1,pendingTime=0;
function fmt(s){return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0')}
data.chapters.forEach((c,i)=>{let b=document.createElement('button');b.textContent=c.round+' '+c.title+' · '+fmt(c.duration_seconds);b.onclick=()=>load(i,true);list.append(b)});
document.getElementById('master').href=data.master;
function load(i,play=false){current=Math.max(0,Math.min(data.chapters.length-1,i));last=-1;const c=data.chapters[current];audio.src=c.audio;audio.playbackRate=Number(document.getElementById('speed').value);document.getElementById('title').textContent=c.title;document.getElementById('counter').textContent=c.round+' / '+data.chapters.length+' · '+fmt(c.duration_seconds);[...list.children].forEach((b,j)=>b.classList.toggle('active',j===current));text.replaceChildren();data.turns[current].forEach(t=>{let p=document.createElement('div');p.className='turn';let b=document.createElement('b');b.textContent=t.speaker+' · '+fmt(t.start);p.append(b,document.createTextNode(t.text));p.onclick=()=>{audio.currentTime=t.start;audio.play().catch(()=>{})};text.append(p)});const segments=document.getElementById('segments');segments.replaceChildren();c.segments.forEach(s=>{let b=document.createElement('button');b.textContent=fmt(s.seconds)+' '+s.title;b.onclick=()=>{audio.currentTime=s.seconds;audio.play().catch(()=>{})};segments.append(b)});if(play)audio.play().catch(()=>{})}
document.getElementById('prev').onclick=()=>load(current-1,true);document.getElementById('next').onclick=()=>load(current+1,true);document.getElementById('speed').onchange=e=>audio.playbackRate=Number(e.target.value);
audio.onended=()=>{if(current<data.chapters.length-1)load(current+1,true)};
audio.ontimeupdate=()=>{let turns=data.turns[current],n=0;while(n+1<turns.length&&turns[n+1].start<=audio.currentTime)n++;if(n!==last){if(last>=0&&text.children[last])text.children[last].classList.remove('active');text.children[n].classList.add('active');last=n}try{localStorage.setItem(data.storageKey,JSON.stringify({chapter:current,time:audio.currentTime}))}catch(e){}};
load(0);try{let saved=JSON.parse(localStorage.getItem(data.storageKey));if(saved&&Number.isInteger(saved.chapter)&&saved.chapter>=0&&saved.chapter<data.chapters.length){pendingTime=saved.time;load(saved.chapter);audio.addEventListener('loadedmetadata',()=>{audio.currentTime=Math.min(pendingTime,audio.duration||pendingTime)},{once:true})}}catch(e){}
</script></html>
